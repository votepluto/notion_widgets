<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Greeting Widget</title>

  <!-- Inter font (Notion-like) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: rgba(55, 53, 47, 0.65);
      --border: rgba(55, 53, 47, 0.14);
      --shadow: rgba(15, 15, 15, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --text: rgba(255,255,255,0.92);
        --muted: rgba(255,255,255,0.65);
        --border: rgba(255,255,255,0.12);
        --shadow: rgba(0,0,0,0.35);
      }
    }

    html, body {
      margin: 0;
      background: transparent;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    .wrap {
      padding: 10px;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .greet {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .date {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .clock {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }

    .time {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .ampm {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="greet" id="greet"></div>
      <div class="date" id="date"></div>
      <div class="clock">
        <span class="time" id="time"></span>
        <span class="ampm" id="ampm"></span>
      </div>
    </div>
  </div>

  <script>
    const NAME = "Edie";
    const FLOWER = "✿";

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function formatTime(date) {
      const h24 = date.getHours();
      const ampm = h24 >= 12 ? "pm" : "am";
      const h12 = (h24 % 12) || 12;
      const mm = pad(date.getMinutes());
      const ss = pad(date.getSeconds());
      return { time: `${h12}:${mm}:${ss}`, ampm };
    }

    function displayGreeting(date) {
      const hour = date.getHours();
      const greeting =
        hour < 12
          ? `${FLOWER} Good morning ${NAME}`
          : `${FLOWER} Good evening ${NAME}`;
      document.getElementById("greet").textContent = greeting;
    }

    function displayDate(date) {
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const months = ["January","February","March","April","May","June",
                      "July","August","September","October","November","December"];
      document.getElementById("date").textContent =
        `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()} ${date.getFullYear()}`;
    }

    function displayClock(date) {
      const { time, ampm } = formatTime(date);
      document.getElementById("time").textContent = time;
      document.getElementById("ampm").textContent = ampm;
    }

    function render() {
      const now = new Date();
      displayGreeting(now);
      displayDate(now);
      displayClock(now);
    }

    render();
    setInterval(render, 500);
  </script>
</body>
</html>
