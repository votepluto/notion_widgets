<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Soft Header</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bgA: #fdf7fb;
      --bgB: #f6eef6;

      --ink: rgba(58, 40, 65, 0.88);
      --muted: rgba(58, 40, 65, 0.52);

      --pill: rgba(58, 40, 65, 0.05);
      --pillBorder: rgba(58, 40, 65, 0.08);

      --rose: rgba(236, 200, 255, 0.35);
      --blush: rgba(255, 210, 240, 0.30);
    }

    *{ box-sizing: border-box; }

    html, body{
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* FULL-WIDTH HEADER BAND */
    .header{
      width: 100%;
      min-height: 100vh;
      padding: 16px clamp(16px, 3vw, 32px);
      display: flex;
      align-items: flex-start;

      background:
        radial-gradient(140% 180% at 85% -20%, var(--rose) 0%, transparent 65%),
        radial-gradient(160% 200% at -20% 130%, var(--blush) 0%, transparent 70%),
        linear-gradient(180deg, var(--bgA) 0%, var(--bgB) 100%);
    }

    .row{
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    /* LEFT */
    .left{
      display: inline-flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .badge{
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--muted);
      opacity: 0.75;
    }

    .greet{
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    /* MIDDLE */
    .middle{
      min-width: 0;
      text-align: center;
    }

    .date{
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* RIGHT */
    .right{
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .time{
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .ampm{
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 10px;
      background: var(--pill);
      border: 1px solid var(--pillBorder);
      border-radius: 999px;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="row">
      <div class="left">
        <div class="badge">✿</div>
        <div class="greet" id="greet"></div>
      </div>

      <div class="middle">
        <div class="date" id="date"></div>
      </div>

      <div class="right">
        <div class="time" id="time"></div>
        <div class="ampm" id="ampm"></div>
      </div>
    </div>
  </div>

  <script>
    function pad(n){
      return String(n).padStart(2, "0");
    }

    function ordinal(n){
      if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
      switch (n % 10) {
        case 1: return n + "st";
        case 2: return n + "nd";
        case 3: return n + "rd";
        default: return n + "th";
      }
    }

    function render(){
      const now = new Date();

      const h24 = now.getHours();
      const ampm = h24 >= 12 ? "pm" : "am";
      const h12 = (h24 % 12) || 12;
      const mm = pad(now.getMinutes());

      document.getElementById("greet").textContent =
        h24 < 12 ? "☀︎ Good morning" : "☾ Good evening";

      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

      document.getElementById("date").textContent =
        `${days[now.getDay()]}, ${ordinal(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;

      document.getElementById("time").textContent = `${h12}:${mm}`;
      document.getElementById("ampm").textContent = ampm;
    }

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
