<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soft Header Greeting</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #fffdf9;
      --bg2: #fbf7f2;
      --ink: rgba(38, 36, 33, 0.92);
      --muted: rgba(38, 36, 33, 0.58);
      --border: rgba(38, 36, 33, 0.10);
      --shadow: rgba(38, 36, 33, 0.06);
      --shadow2: rgba(38, 36, 33, 0.04);
      --pill: rgba(38, 36, 33, 0.06);
      --pillBorder: rgba(38, 36, 33, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root{
        --bg1: #23201c;
        --bg2: #1d1b18;
        --ink: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.60);
        --border: rgba(255, 255, 255, 0.12);
        --shadow: rgba(0, 0, 0, 0.35);
        --shadow2: rgba(0, 0, 0, 0.22);
        --pill: rgba(255, 255, 255, 0.07);
        --pillBorder: rgba(255, 255, 255, 0.12);
      }
    }

    html, body{
      margin: 0;
      background: transparent;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
    }

    /* Full-width header */
    .header{
      width: 100%;
      padding: 18px 22px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      box-shadow: 0 14px 40px var(--shadow), 0 6px 18px var(--shadow2);
      position: relative;
      overflow: hidden;
    }

    /* dreamy glow accents */
    .header::before{
      content:"";
      position:absolute;
      top:-80px; right:-70px;
      width: 220px; height: 220px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 214, 233, 0.32), rgba(255, 214, 233, 0));
      pointer-events:none;
      filter: blur(1px);
    }
    .header::after{
      content:"";
      position:absolute;
      bottom:-90px; left:-90px;
      width: 260px; height: 260px;
      background: radial-gradient(circle at 60% 60%, rgba(214, 232, 255, 0.24), rgba(214, 232, 255, 0));
      pointer-events:none;
      filter: blur(1px);
    }

    .row{
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .left{
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .badge{
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: var(--pill);
      border: 1px solid var(--pillBorder);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .textBlock{
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .greet{
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .date{
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .right{
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .time{
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .ampm{
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 10px;
      background: var(--pill);
      border: 1px solid var(--pillBorder);
      border-radius: 999px;
      transform: translateY(-3px);
      white-space: nowrap;
    }

    /* Mobile-friendly stacking */
    @media (max-width: 420px){
      .header{ padding: 16px 16px; }
      .greet{ font-size: 20px; }
      .time{ font-size: 24px; }
      .right{ width: 100%; justify-content: flex-start; }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="row">
      <div class="left">
        <div class="badge">✿</div>
        <div class="textBlock">
          <div class="greet" id="greet"></div>
          <div class="date" id="date"></div>
        </div>
      </div>

      <div class="right" aria-label="Current time">
        <div class="time" id="time"></div>
        <div class="ampm" id="ampm"></div>
      </div>
    </div>
  </div>

  <script>
    const NAME = "Edie";

    function pad(n){ return String(n).padStart(2,"0"); }

    function formatTime(date){
      const h24 = date.getHours();
      const ampm = h24 >= 12 ? "pm" : "am";
      const h12 = (h24 % 12) || 12;
      const mm = pad(date.getMinutes());
      return { time: `${h12}:${mm}`, ampm, h24 };
    }

    function setGreeting(h24){
      const greeting = h24 < 12 ? `✿ Good morning ${NAME}` : `✿ Good evening ${NAME}`;
      document.getElementById("greet").textContent = greeting;
    }

    function setDate(date){
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      document.getElementById("date").textContent =
        `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()} ${date.getFullYear()}`;
    }

    function render(){
      const now = new Date();
      const ft = formatTime(now);
      setGreeting(ft.h24);
      setDate(now);
      document.getElementById("time").textContent = ft.time;
      document.getElementById("ampm").textContent = ft.ampm;
    }

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
