<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A soft, responsive mini calendar made for Notion.">
  <meta name="theme-color" content="#eeeafe">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23eee7f7'/%3E%3Cpath d='M17 24h30v24H17z' fill='%23fff'/%3E%3Cpath d='M17 24h30v8H17z' fill='%238c73a8'/%3E%3C/svg%3E">
  <title>Mini Calendar</title>
  <style>
    :root {
      color-scheme: light;
      --page: #ecebef;
      --shell: rgba(255,255,255,.86);
      --shell-solid: #fbfaff;
      --ink: #48414f;
      --muted: #8a8191;
      --faint: #b5acba;
      --line: rgba(68,57,78,.09);
      --accent: #8c73a8;
      --accent-deep: #62506f;
      --accent-ink: #fff;
      --accent-soft: #eee7f7;
      --week-wash: rgba(202,187,221,.18);
      --weekend: #8d8492;
      --shadow: 0 26px 70px rgba(70,57,83,.14), inset 0 1px 0 rgba(255,255,255,.94);
      --radius: 30px;
      --cell: 36px;
      --column-gap: 10px;
      --row-gap: 6px;
      --side: 28px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 250px;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: start;
      padding: 8px;
      color: var(--ink);
      background: transparent;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }

    body.preview {
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 8% 12%, rgba(197,210,250,.72), transparent 28rem),
        radial-gradient(circle at 92% 85%, rgba(251,206,223,.62), transparent 30rem),
        linear-gradient(145deg, #e9e9fb, #f8f1f8 53%, #fff3f5);
    }

    button, summary, input { font: inherit; }
    button, summary { -webkit-tap-highlight-color: transparent; }

    .calendar {
      container: calendar / inline-size;
      position: relative;
      width: min(100%, 620px);
      min-width: 0;
      max-width: calc(100vw - 16px);
      overflow: visible;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: var(--radius);
      background: var(--shell);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px) saturate(112%);
      transition: border-radius .18s ease, background .18s ease, box-shadow .18s ease;
    }

    body.embed .calendar {
      width: 100%;
      max-width: none;
      min-height: calc(100vh - 16px);
      resize: none;
    }

    body.preview .calendar { min-height: 328px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 24px var(--side) 14px;
    }

    .month-button {
      min-width: 0;
      padding: 3px 4px;
      border: 0;
      border-radius: 12px;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .month-title {
      display: block;
      overflow: hidden;
      font-family: "Avenir Next", Avenir, "Century Gothic", sans-serif;
      font-size: clamp(1.45rem, 5.6cqi, 2rem);
      font-weight: 560;
      letter-spacing: -.05em;
      line-height: .95;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .year-label {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 780;
      letter-spacing: .12em;
      line-height: 1;
    }

    .controls { display: flex; align-items: center; gap: 6px; }
    .nav-controls { display: flex; align-items: center; gap: 6px; }

    .icon-button, .today-button, .menu summary {
      min-width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
    }

    .icon-button { padding: 0 0 2px; font-size: 1.18rem; }
    .today-button { padding: 0 12px; color: var(--accent-deep); font-size: .68rem; font-weight: 780; }
    .today-button.is-current-month { color: var(--accent-ink); background: var(--accent-deep); }

    .icon-button:hover, .today-button:hover, .menu summary:hover, .month-button:hover { background: var(--accent-soft); }
    .today-button.is-current-month:hover { color: var(--accent-ink); background: var(--accent); }
    .icon-button:active, .today-button:active, .menu summary:active { transform: scale(.94); }

    .menu { position: relative; }
    .menu summary { list-style: none; font-size: 1rem; letter-spacing: .06em; padding: 0 0 7px; }
    .menu summary::-webkit-details-marker { display: none; }
    .menu-panel {
      position: absolute;
      z-index: 20;
      top: 44px;
      right: 0;
      width: min(268px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 20px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 20px 52px rgba(70,57,83,.2), inset 0 1px 0 white;
      backdrop-filter: blur(22px);
    }

    .menu-title { margin: 0 0 10px; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .swatch {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(65,55,74,.1);
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
    }
    .swatch[aria-pressed="true"] { outline: 2px solid var(--accent-deep); outline-offset: 2px; }
    .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 15px; color: var(--ink); font-size: .78rem; font-weight: 680; }
    .switch { position: relative; width: 38px; height: 23px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: #ddd8df; transition: background .15s ease; }
    .switch span::after { content: ""; position: absolute; width: 17px; height: 17px; top: 3px; left: 3px; border-radius: 50%; background: white; box-shadow: 0 2px 5px rgba(40,32,46,.18); transition: transform .15s ease; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(15px); }

    .calendar-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap: var(--row-gap) var(--column-gap);
      isolation: isolate;
      padding: 0 var(--side) 16px;
    }

    .weekday {
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 760;
      letter-spacing: .04em;
    }

    .week-wash {
      position: absolute;
      z-index: -1;
      left: var(--side);
      right: var(--side);
      top: calc(22px + var(--row-gap) + (var(--week-row) * (var(--cell) + var(--row-gap))));
      height: var(--cell);
      border-radius: 13px;
      background: linear-gradient(90deg, transparent, var(--week-wash) 8%, var(--week-wash) 92%, transparent);
      pointer-events: none;
    }

    .day-button, .empty-cell {
      width: var(--cell);
      height: var(--cell);
      justify-self: center;
    }

    .day-button {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font-size: clamp(.76rem, 3.1cqi, .92rem);
      font-weight: 620;
      line-height: 1;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease, border-color .14s ease, color .14s ease, box-shadow .14s ease;
    }

    .day-button:hover { background: rgba(255,255,255,.72); }
    .day-button:active { transform: scale(.94); }
    .day-button.is-weekend:not(.is-selected):not(.is-today) { color: var(--weekend); }
    .day-button.is-today { color: var(--accent-deep); background: var(--accent-soft); font-weight: 800; }
    .day-button.is-selected { border-color: var(--accent); background: rgba(255,255,255,.82); color: var(--accent-deep); font-weight: 800; box-shadow: 0 4px 13px rgba(80,62,95,.09); }
    .day-button.is-selected.is-today { color: var(--accent-ink); background: var(--accent); box-shadow: 0 5px 14px rgba(91,67,112,.18); }

    .event-dots { position: absolute; bottom: 3px; left: 50%; display: flex; gap: 2px; transform: translateX(-50%); }
    .event-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
    .event-dot.soft { background: #aaa0b0; }
    .event-dot.outline { border: 1px solid var(--accent); background: transparent; }
    .day-button.is-selected.is-today .event-dot { background: white; border-color: white; }

    .day-detail {
      margin: 0 var(--side) var(--side);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 19px;
      background: linear-gradient(100deg, var(--accent-soft), rgba(255,255,255,.52));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.88);
    }

    .day-detail-button {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 15px 17px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .detail-date { display: block; color: var(--accent-deep); font-size: .63rem; font-weight: 820; letter-spacing: .12em; text-transform: uppercase; }
    .detail-summary { display: block; overflow: hidden; margin-top: 6px; font-size: .82rem; font-weight: 650; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .detail-chevron { color: var(--accent-deep); font-size: .84rem; transition: transform .15s ease; }
    .day-detail.is-open .detail-chevron { transform: rotate(180deg); }
    .detail-events { display: none; margin: 0; padding: 0 17px 16px 32px; color: var(--ink); font-size: .76rem; line-height: 1.5; }
    .day-detail.is-open .detail-events { display: block; }
    .detail-events li + li { margin-top: 4px; }
    .detail-empty { list-style: none; margin-left: -15px; color: var(--muted); }

    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    .calendar[data-height="short"] .toolbar { padding-top: 15px; padding-bottom: 8px; }
    .calendar[data-height="short"] .calendar-grid { padding-bottom: 9px; }
    .calendar[data-height="short"] .day-detail { margin-bottom: 14px; }
    .calendar[data-height="short"] .day-detail-button { padding-block: 10px; }
    .calendar[data-height="short"] .detail-events { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

    @container calendar (max-width: 455px) {
      .toolbar { gap: 10px; padding-top: 20px; }
      .month-title { font-size: 1.4rem; }
      .today-button { width: 36px; padding: 0; font-size: 0; }
      .today-button::before { content: "●"; font-size: .55rem; }
      .day-detail { border-radius: 17px; }
    }

    @container calendar (max-width: 345px) {
      .toolbar { grid-template-columns: minmax(0,1fr); padding-top: 17px; padding-bottom: 10px; }
      .controls { justify-content: space-between; }
      .menu { margin-left: auto; }
      .month-title { font-size: 1.3rem; }
      .calendar-grid { padding-bottom: 12px; }
      .day-detail { margin-bottom: 16px; }
      .detail-summary { font-size: .76rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calendar" id="calendar" aria-label="Mini calendar">
    <header class="toolbar">
      <button class="month-button" id="monthButton" type="button" aria-label="Jump to today" title="Jump to today">
        <span class="month-title" id="monthTitle"></span>
        <span class="year-label" id="yearLabel"></span>
      </button>

      <div class="controls">
        <nav class="nav-controls" aria-label="Calendar navigation">
          <button class="icon-button" id="prevMonth" type="button" aria-label="Previous month" title="Previous month">‹</button>
          <button class="today-button" id="todayButton" type="button" aria-label="Return to this month">Today</button>
          <button class="icon-button" id="nextMonth" type="button" aria-label="Next month" title="Next month">›</button>
        </nav>

        <details class="menu" id="settingsMenu">
          <summary aria-label="Calendar appearance" title="Calendar appearance">•••</summary>
          <div class="menu-panel">
            <p class="menu-title">Background colour</p>
            <div class="swatches" id="themeSwatches" aria-label="Background colours"></div>
            <label class="menu-row">Show event markers
              <span class="switch"><input id="eventsToggle" type="checkbox"><span aria-hidden="true"></span></span>
            </label>
            <label class="menu-row">Week starts Monday
              <span class="switch"><input id="mondayToggle" type="checkbox"><span aria-hidden="true"></span></span>
            </label>
          </div>
        </details>
      </div>
    </header>

    <section class="calendar-grid" id="calendarGrid" aria-label="Monthly calendar"></section>

    <section class="day-detail" id="dayDetail" aria-labelledby="detailDate">
      <button class="day-detail-button" id="detailButton" type="button" aria-expanded="false" aria-controls="detailEvents">
        <span><span class="detail-date" id="detailDate"></span><span class="detail-summary" id="detailSummary"></span></span>
        <span class="detail-chevron" aria-hidden="true">⌄</span>
      </button>
      <ul class="detail-events" id="detailEvents"></ul>
    </section>

    <p class="sr-only" id="liveStatus" aria-live="polite"></p>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const calendar = $("#calendar");
    const calendarGrid = $("#calendarGrid");
    const monthTitle = $("#monthTitle");
    const yearLabel = $("#yearLabel");
    const todayButton = $("#todayButton");
    const liveStatus = $("#liveStatus");
    const dayDetail = $("#dayDetail");
    const detailButton = $("#detailButton");
    const detailDate = $("#detailDate");
    const detailSummary = $("#detailSummary");
    const detailEvents = $("#detailEvents");
    const settingsMenu = $("#settingsMenu");
    const eventsToggle = $("#eventsToggle");
    const mondayToggle = $("#mondayToggle");

    const params = new URLSearchParams(location.search);
    document.body.classList.toggle("embed", params.has("embed"));
    document.body.classList.toggle("preview", params.has("preview"));

    const THEMES = {

    const EVENTS = buildEventMap([

      {start:"2026-02-17",end:"2026-02-21",label:"Lunar New Year / Year of the Horse",type:EVENT_TYPE.OBSERVANCE},{date:"2026-02-18",label:"Ramadan begins (dates may vary)",type:EVENT_TYPE.OBSERVANCE},{date:"2026-03-04",label:"Holi",type:EVENT_TYPE.OBSERVANCE},{date:"2026-03-08",label:"International Women's Day",type:EVENT_TYPE.OBSERVANCE},{start:"2026-03-16",end:"2026-03-22",label:"Harmony Week",type:EVENT_TYPE.OBSERVANCE},{date:"2026-03-20",label:"Eid al-Fitr (dates may vary)",type:EVENT_TYPE.OBSERVANCE},{date:"2026-03-21",label:"International Day for the Elimination of Racial Discrimination",type:EVENT_TYPE.OBSERVANCE},{date:"2026-04-02",label:"World Autism Awareness Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-04-14",label:"Vaisakhi",type:EVENT_TYPE.OBSERVANCE},{date:"2026-05-01",label:"Vesak / Buddha Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-05-17",label:"IDAHOBIT",type:EVENT_TYPE.OBSERVANCE},{date:"2026-06-05",label:"World Environment Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-06-20",label:"World Refugee Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-06-21",label:"International Day of Yoga",type:EVENT_TYPE.OBSERVANCE},{date:"2026-08-12",label:"International Youth Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-09-21",label:"International Day of Peace",type:EVENT_TYPE.OBSERVANCE},{date:"2026-09-25",label:"Mid-Autumn Festival",type:EVENT_TYPE.OBSERVANCE},{date:"2026-10-17",label:"International Day for the Eradication of Poverty",type:EVENT_TYPE.OBSERVANCE},{date:"2026-11-08",label:"Diwali",type:EVENT_TYPE.OBSERVANCE},{date:"2026-11-11",label:"Remembrance Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-11-20",label:"World Children's Day",type:EVENT_TYPE.OBSERVANCE},{date:"2026-11-25",label:"International Day for the Elimination of Violence against Women",type:EVENT_TYPE.OBSERVANCE},{date:"2026-12-03",label:"International Day of People with Disability",type:EVENT_TYPE.OBSERVANCE},{start:"2026-12-04",end:"2026-12-12",label:"Hanukkah",type:EVENT_TYPE.OBSERVANCE},{date:"2026-12-10",label:"Human Rights Day",type:EVENT_TYPE.OBSERVANCE},
      {date:"2026-04-07",label:"World Health Day",type:EVENT_TYPE.WELLBEING},{date:"2026-05-12",label:"International Nurses Day",type:EVENT_TYPE.WELLBEING},{start:"2026-06-15",end:"2026-06-21",label:"Men's Health Week",type:EVENT_TYPE.WELLBEING},{date:"2026-09-10",label:"World Suicide Prevention Day",type:EVENT_TYPE.WELLBEING},{start:"2026-10-01",end:"2026-10-31",label:"Mental Health Month",type:EVENT_TYPE.WELLBEING},{start:"2026-10-01",end:"2026-10-07",label:"BPD Awareness Week",type:EVENT_TYPE.WELLBEING},{date:"2026-10-10",label:"World Mental Health Day",type:EVENT_TYPE.WELLBEING},{date:"2026-10-10",label:"World Homeless Day",type:EVENT_TYPE.WELLBEING},{start:"2026-10-11",end:"2026-10-17",label:"National Carers Week",type:EVENT_TYPE.WELLBEING},{start:"2026-10-11",end:"2026-10-17",label:"OCD Awareness Week",type:EVENT_TYPE.WELLBEING}
    ]);

    const storageKey = "little-widgets-mini-calendar-v2";
    const saved = loadPreferences();
    let preferences = { theme: saved.theme in THEMES ? saved.theme : "default", showEvents: saved.showEvents !== false, mondayFirst: saved.mondayFirst !== false };
    let today = startOfDay(new Date());
    let selectedDate = new Date(today);
    let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    let focusAfterRender = false;

    const monthFormatter = new Intl.DateTimeFormat("en-AU", {month:"long"});
    const detailFormatter = new Intl.DateTimeFormat("en-AU", {weekday:"long",day:"numeric",month:"long"});
    const fullFormatter = new Intl.DateTimeFormat("en-AU", {weekday:"long",day:"numeric",month:"long",year:"numeric"});

    function loadPreferences() { try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { return {}; } }
    function savePreferences() { try { localStorage.setItem(storageKey, JSON.stringify(preferences)); } catch {} }
    function startOfDay(date) { const next = new Date(date); next.setHours(0,0,0,0); return next; }
    function addDays(date, days) { const next = new Date(date.getFullYear(), date.getMonth(), date.getDate() + days, 12); return startOfDay(next); }
    function dateFromKey(key) { const [y,m,d] = key.split("-").map(Number); return new Date(y,m-1,d,12); }
    function dateKey(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`; }
    function sameDate(a,b) { return dateKey(a) === dateKey(b); }
    function sameMonth(a,b) { return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }
    function isWeekend(date) { return date.getDay() === 0 || date.getDay() === 6; }

    function buildEventMap(items) {
      const map = {};
      const add = (key,event) => { map[key] ||= []; if (!map[key].some(item => item.label === event.label && item.type === event.type)) map[key].push({label:event.label,type:event.type}); };
      items.forEach(event => {
        if (event.date) return add(event.date,event);
        for (let day = dateFromKey(event.start); day <= dateFromKey(event.end); day = addDays(day,1)) add(dateKey(day),event);
      });
      return map;
    }

    function applyTheme(name) {
      const theme = THEMES[name] || THEMES.default;
      const root = document.documentElement.style;
      root.setProperty("--page",theme.page); root.setProperty("--shell",theme.shell); root.setProperty("--shell-solid",theme.solid);
      root.setProperty("--accent",theme.accent); root.setProperty("--accent-deep",theme.deep); root.setProperty("--accent-soft",theme.soft); root.setProperty("--week-wash",theme.wash);
      if (document.body.classList.contains("preview")) document.body.style.backgroundColor = theme.page;
      document.querySelectorAll(".swatch").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.theme === name)));
    }

    function createThemeControls() {
      Object.entries(THEMES).forEach(([name,theme]) => {
        const button = document.createElement("button"); button.type = "button"; button.className = "swatch"; button.dataset.theme = name;
        button.style.setProperty("--swatch",theme.swatch); button.setAttribute("aria-label",theme.label); button.title = theme.label;
        button.addEventListener("click", () => { preferences.theme = name; applyTheme(name); savePreferences(); });
        $("#themeSwatches").append(button);
      });
    }

    function visibleDates() {
      const y = visibleMonth.getFullYear(), m = visibleMonth.getMonth();
      const offset = preferences.mondayFirst ? (new Date(y,m,1).getDay()+6)%7 : new Date(y,m,1).getDay();
      const days = new Date(y,m+1,0).getDate();
      return Array.from({length:42},(_,index) => { const day = index-offset+1; return day < 1 || day > days ? null : startOfDay(new Date(y,m,day)); });
    }

    function dotClass(type) { if (type === EVENT_TYPE.OBSERVANCE) return "outline"; if (type === EVENT_TYPE.SCHOOL || type === EVENT_TYPE.WELLBEING) return "soft"; return "strong"; }

    function updateDetail() {
      const events = preferences.showEvents ? (EVENTS[dateKey(selectedDate)] || []) : [];
      detailDate.textContent = detailFormatter.format(selectedDate);
      detailSummary.textContent = events.length ? `${events[0].label}${events.length > 1 ? ` · +${events.length-1}` : ""}` : "nothing planned ♡";
      detailEvents.replaceChildren();
      if (!events.length) {
        const li = document.createElement("li"); li.className = "detail-empty"; li.textContent = "A clear little day."; detailEvents.append(li);
      } else events.forEach(event => { const li = document.createElement("li"); li.textContent = event.label; detailEvents.append(li); });
      detailButton.disabled = false;
    }

    function render() {
      calendarGrid.replaceChildren();
      const weekdayLabels = preferences.mondayFirst ? ["Mo","Tu","We","Th","Fr","Sa","Su"] : ["Su","Mo","Tu","We","Th","Fr","Sa"];
      weekdayLabels.forEach(label => { const item = document.createElement("div"); item.className = "weekday"; item.setAttribute("aria-hidden","true"); item.textContent = label; calendarGrid.append(item); });

      const dates = visibleDates();
      const todayIndex = dates.findIndex(date => date && sameDate(date,today));
      if (todayIndex >= 0) {
        const wash = document.createElement("div"); wash.className = "week-wash"; wash.setAttribute("aria-hidden","true"); wash.style.setProperty("--week-row",Math.floor(todayIndex/7)); calendarGrid.append(wash);
      }

      let selectedButton;
      dates.forEach(date => {
        if (!date) { const empty = document.createElement("span"); empty.className = "empty-cell"; empty.setAttribute("aria-hidden","true"); calendarGrid.append(empty); return; }
        const events = preferences.showEvents ? (EVENTS[dateKey(date)] || []) : [];
        const button = document.createElement("button"); button.type = "button"; button.className = "day-button"; button.textContent = date.getDate();
        const selected = sameDate(date,selectedDate);
        button.setAttribute("aria-label",`${selected ? "Selected, " : ""}${fullFormatter.format(date)}${events.length ? `, ${events.map(event=>event.label).join(", ")}` : ""}`);
        button.tabIndex = selected ? 0 : -1;
        if (isWeekend(date)) button.classList.add("is-weekend");
        if (sameDate(date,today)) { button.classList.add("is-today"); button.setAttribute("aria-current","date"); }
        if (sameDate(date,selectedDate)) { button.classList.add("is-selected"); selectedButton = button; }
        if (events.length) {
          const dots = document.createElement("span"); dots.className = "event-dots"; dots.setAttribute("aria-hidden","true");
          [...new Set(events.map(event=>dotClass(event.type)))].slice(0,3).forEach(kind => { const dot = document.createElement("span"); dot.className = `event-dot ${kind}`; dots.append(dot); });
          button.append(dots);
        }
        button.addEventListener("click",() => { selectedDate = new Date(date); updateVisibleMonth(); render(); });
        calendarGrid.append(button);
      });
      monthTitle.textContent = monthFormatter.format(visibleMonth); yearLabel.textContent = visibleMonth.getFullYear();
      todayButton.classList.toggle("is-current-month",sameMonth(visibleMonth,today));
      updateDetail();
      liveStatus.textContent = `Selected ${fullFormatter.format(selectedDate)}`;
      if (focusAfterRender && selectedButton) { selectedButton.focus(); focusAfterRender = false; }
      fit();
    }

    function updateVisibleMonth() { visibleMonth = new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1); }
    function moveDays(days) { selectedDate = addDays(selectedDate,days); updateVisibleMonth(); focusAfterRender = true; render(); }
    function moveMonths(months) {
      const day = selectedDate.getDate(), target = new Date(selectedDate.getFullYear(),selectedDate.getMonth()+months,1);
      selectedDate = new Date(target.getFullYear(),target.getMonth(),Math.min(day,new Date(target.getFullYear(),target.getMonth()+1,0).getDate()));
      updateVisibleMonth(); focusAfterRender = true; render();
    }
    function jumpToday() { today = startOfDay(new Date()); selectedDate = new Date(today); updateVisibleMonth(); focusAfterRender = true; render(); }

    function fit() {
      const rect = calendar.getBoundingClientRect();
      const side = Math.max(14,Math.min(30,rect.width*.055));
      const gap = Math.max(2,Math.min(10,rect.width*.016));
      const cellByWidth = (rect.width-side*2-gap*6)/7;
      let cell = Math.max(27,Math.min(40,cellByWidth));
      if (document.body.classList.contains("embed") && rect.height < 380) cell = Math.min(cell,30);
      calendar.style.setProperty("--side",`${side}px`); calendar.style.setProperty("--column-gap",`${gap}px`); calendar.style.setProperty("--cell",`${cell}px`);
      calendar.dataset.height = rect.height < 365 ? "short" : "comfortable";
    }

    $("#prevMonth").addEventListener("click",()=>moveMonths(-1));
    $("#nextMonth").addEventListener("click",()=>moveMonths(1));
    $("#monthButton").addEventListener("click",jumpToday);
    todayButton.addEventListener("click",jumpToday);
    detailButton.addEventListener("click",()=>{ const open = !dayDetail.classList.contains("is-open"); dayDetail.classList.toggle("is-open",open); detailButton.setAttribute("aria-expanded",String(open)); });
    eventsToggle.addEventListener("change",()=>{ preferences.showEvents = eventsToggle.checked; savePreferences(); render(); });
    mondayToggle.addEventListener("change",()=>{ preferences.mondayFirst = mondayToggle.checked; savePreferences(); render(); });

    calendarGrid.addEventListener("keydown",event => {
      const dayMoves = {ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7};
      if (event.key in dayMoves) { event.preventDefault(); moveDays(dayMoves[event.key]); }
      else if (event.key === "Home") { event.preventDefault(); jumpToday(); }
      else if (event.key === "PageUp" || event.key === "PageDown") { event.preventDefault(); moveMonths((event.key === "PageUp" ? -1 : 1) * (event.shiftKey ? 12 : 1)); }
    });

    document.addEventListener("click",event => { if (settingsMenu.open && !settingsMenu.contains(event.target)) settingsMenu.removeAttribute("open"); });
    document.addEventListener("keydown",event => { if (event.key === "Escape" && settingsMenu.open) { settingsMenu.removeAttribute("open"); settingsMenu.querySelector("summary").focus(); } });

    createThemeControls(); applyTheme(preferences.theme); eventsToggle.checked = preferences.showEvents; mondayToggle.checked = preferences.mondayFirst; render();
    if ("ResizeObserver" in window) new ResizeObserver(fit).observe(calendar); else addEventListener("resize",fit);
    setInterval(()=>{ const current = startOfDay(new Date()); if (!sameDate(current,today)) { const followedToday = sameDate(selectedDate,today); today=current; if (followedToday) { selectedDate=new Date(today); updateVisibleMonth(); } render(); } },60000);
  </script>
